name: Knowledge and tools
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/pcb.py verify-sources
      - run: python tools/check_repo.py
      - run: python -m unittest discover -s tests -v
      - run: node --test --test-concurrency=1 tests/test_eda_actions.js tests/test_drawing_actions.js
